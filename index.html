<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Stock Manager</title>
<style>
:root{--bg:#faf7f5;--card:#fff;--text:#2b2320;--muted:#6f645d;--accent:#b5765a;--accent-dark:#96593f;--soft:#f3e2d9;--border:#e8ddd5;--green:#4c8c5c;--red:#c1503f;--amber:#b8862c}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px 60px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.wrap{max-width:920px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}h1{margin:0;font-size:1.5rem}h2{font-size:1.05rem;margin:0 0 14px}.subtitle{color:var(--muted);font-size:.9rem;margin-top:4px}.top-actions,.controls-row,.qty-controls,.row-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.controls-row{justify-content:space-between;margin-bottom:14px}.summary-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}.summary-card,.card{background:var(--card);border:1px solid var(--border);box-shadow:0 2px 10px rgba(60,40,25,.06)}.summary-card{border-radius:14px;padding:16px}.summary-card .label{color:var(--muted);font-size:.78rem;text-transform:uppercase}.summary-card .value{font-size:1.6rem;font-weight:700;margin-top:4px}.warn .value{color:var(--amber)}.danger .value{color:var(--red)}.card{border-radius:16px;padding:20px;margin-bottom:20px}.add-form{display:grid;grid-template-columns:1.4fr 1fr 1fr .8fr auto;gap:10px;align-items:end}.field{display:flex;flex-direction:column;gap:5px}label{color:var(--muted);font-size:.78rem}input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);font-size:.92rem}input:focus{outline:2px solid var(--accent);outline-offset:1px}button{cursor:pointer;border:0;border-radius:9px;padding:10px 16px;font-weight:600;font-size:.9rem;background:transparent;color:var(--text)}.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-dark)}.btn-ghost,.icon-btn{border:1px solid var(--border)}button:hover{background:var(--soft)}.search-box{flex:1;min-width:180px}.overflow-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:.75rem;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--border)}td{padding:10px;border-bottom:1px solid var(--border);font-size:.92rem}tr:last-child td{border-bottom:0}.item-name{font-weight:600}.item-tags{color:var(--muted);font-size:.78rem;margin-top:2px}.qty-btn{width:30px;height:30px;padding:0}.qty-num{min-width:32px;text-align:center;font-weight:700}.qty-input{width:56px;padding:6px;text-align:center}.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:700}.ok{background:#e7f3e9;color:var(--green)}.low{background:#fbf2df;color:var(--amber)}.out{background:#fbeae7;color:var(--red)}.empty-state{padding:40px 20px;text-align:center;color:var(--muted)}.log-list{max-height:220px;overflow-y:auto}.log-item{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:.85rem}.log-time{color:var(--muted);font-size:.75rem;white-space:nowrap}.log-plus{color:var(--green);font-weight:700}.log-minus{color:var(--red);font-weight:700}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:var(--accent-dark);color:#fff;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}@media(max-width:700px){.add-form{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>Stock Manager</h1><div class="subtitle">Track your inventory</div></div><div class="top-actions"><button class="btn-ghost" id="exportBtn">Export CSV</button><button class="btn-ghost" id="resetBtn">Reset all data</button></div></header>
<div class="summary-row" id="summaryRow"></div>
<section class="card"><h2>Add new item</h2><form class="add-form" id="addForm"><div class="field"><label for="fName">Name / style</label><input id="fName" placeholder="e.g. Chiffon Square" required></div><div class="field"><label for="fColor">Color</label><input id="fColor" placeholder="e.g. Dusty Rose"></div><div class="field"><label for="fFabric">Fabric / size</label><input id="fFabric" placeholder="e.g. Chiffon, 70x70"></div><div class="field"><label for="fQty">Start qty</label><input id="fQty" type="number" min="0" value="0" required></div><button class="btn-primary" type="submit">Add item</button></form></section>
<section class="card"><div class="controls-row"><h2 style="margin:0">Inventory</h2><div class="search-box"><input id="searchInput" placeholder="Search by name, color, or fabric..."></div></div><div class="overflow-scroll"><table><thead><tr><th>Item</th><th>Status</th><th>Quantity</th><th>Restock / Deplete</th><th></th></tr></thead><tbody id="invBody"></tbody></table></div><div class="empty-state" id="emptyState">No items yet. Add your first item above.</div></section>
<section class="card"><div class="controls-row"><h2 style="margin:0">Recent activity</h2><button class="btn-ghost" id="clearLogBtn">Clear log</button></div><div class="log-list" id="logList"></div></section>
</div><div class="toast" id="toast"></div>
<script>
(()=>{const ITEMS='hijab_inventory_items_v1',LOG='hijab_inventory_log_v1',LOW=5;$=id=>document.getElementById(id);let items=read(ITEMS,[]),log=read(LOG,[]);function read(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{showToast('Could not save data')}}function uid(){return'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function status(q){return q<=0?['Out of stock','out']:q<=LOW?['Low stock','low']:['In stock','ok']}function showToast(m){let t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),1800)}function addLog(name,delta,qty){log.unshift({name,delta,qty,time:new Date().toISOString()});log=log.slice(0,100);save(LOG,log)}function render(){let total=items.reduce((s,i)=>s+i.qty,0),low=items.filter(i=>i.qty>0&&i.qty<=LOW).length,out=items.filter(i=>i.qty<=0).length;$('summaryRow').innerHTML=`<div class="summary-card"><div class="label">Total items tracked</div><div class="value">${items.length}</div></div><div class="summary-card"><div class="label">Total pieces in stock</div><div class="value">${total}</div></div><div class="summary-card warn"><div class="label">Low stock</div><div class="value">${low}</div></div><div class="summary-card danger"><div class="label">Out of stock</div><div class="value">${out}</div></div>`;let q=$('searchInput').value.toLowerCase().trim(),filtered=items.filter(i=>(i.name+' '+i.color+' '+i.fabric).toLowerCase().includes(q));$('emptyState').style.display=filtered.length?'none':'block';$('emptyState').textContent=items.length&&!filtered.length?'No items match your search.':'No items yet. Add your first item above.';$('invBody').innerHTML=filtered.map(i=>{let[s,c]=status(i.qty);return`<tr data-id="${i.id}"><td><div class="item-name">${esc(i.name)}</div><div class="item-tags">${esc([i.color,i.fabric].filter(Boolean).join(' · '))}</div></td><td><span class="badge ${c}">${s}</span></td><td><div class="qty-controls"><button class="btn-ghost qty-btn" data-action="dec">−</button><span class="qty-num">${i.qty}</span><button class="btn-ghost qty-btn" data-action="inc">+</button></div></td><td><div class="qty-controls"><input class="qty-input" type="number" min="1" value="10" data-role="amount"><button class="btn-ghost" data-action="restock">Restock</button><button class="btn-ghost" data-action="deplete">Deplete</button></div></td><td><button class="icon-btn" data-action="delete">🗑</button></td></tr>`}).join('');$('logList').innerHTML=log.length?log.map(x=>`<div class="log-item"><span><strong>${esc(x.name)}</strong> <span class="${x.delta>0?'log-plus':'log-minus'}">${x.delta>0?'+':''}${x.delta}</span> → ${x.qty} in stock</span><span class="log-time">${new Date(x.time).toLocaleString()}</span></div>`).join(''):'<div class="empty-state" style="padding:10px">No activity yet.</div>'}function change(i,d){let n=Math.max(0,i.qty+d),a=n-i.qty;if(!a)return;i.qty=n;save(ITEMS,items);addLog(i.name,a,i.qty);render()}$('addForm').onsubmit=e=>{e.preventDefault();let name=$('fName').value.trim();if(!name)return;let qty=Math.max(0,parseInt($('fQty').value,10)||0);items.push({id:uid(),name,color:$('fColor').value.trim(),fabric:$('fFabric').value.trim(),qty});save(ITEMS,items);addLog(name,qty,qty);e.target.reset();$('fQty').value=0;render();showToast(`Added "${name}"`)};$('invBody').onclick=e=>{let b=e.target.closest('[data-action]'),r=e.target.closest('tr');if(!b||!r)return;let i=items.find(x=>x.id===r.dataset.id),a=b.dataset.action;if(!i)return;if(a==='inc')change(i,1);else if(a==='dec')change(i,-1);else if(a==='restock'||a==='deplete'){let n=Math.max(1,parseInt(r.querySelector('[data-role="amount"]').value,10)||1);change(i,a==='restock'?n:-n)}else if(a==='delete'&&confirm(`Remove "${i.name}" from inventory?`)){items=items.filter(x=>x!==i);save(ITEMS,items);addLog(i.name,-i.qty,0);render()}};$('searchInput').oninput=render;$('clearLogBtn').onclick=()=>{log=[];save(LOG,log);render()};$('resetBtn').onclick=()=>{if(confirm('This will permanently delete all items and history. Continue?')){items=[];log=[];save(ITEMS,items);save(LOG,log);render()}};$('exportBtn').onclick=()=>{if(!items.length){showToast('No items to export');return}let q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',csv='Name,Color,Fabric/Size,Quantity,Status\n'+items.map(i=>[q(i.name),q(i.color),q(i.fabric),i.qty,q(status(i.qty)[0])].join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='inventory.csv';a.click()};render()})();
</script>
</body></html>
